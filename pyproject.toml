[project]
name = "langchain-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anik Chowdhury", email = "chowdhuryanik027@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-generativeai>=0.8.6",
    "huggingface-hub>=1.28.0",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.6.0",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.4",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.0",
    "numpy>=2.5.2",
    "openai>=3.3.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "streamlit>=1.62.0",
    "transformers>=5.15.1",
]

[project.scripts]
langchain = "langchain:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
